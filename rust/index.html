<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Scribble (WebAssembly)</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
    background: #f5f5f7;
  }
  h1 { font-size: 18px; margin: 0; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .toolbar label { font-size: 13px; }
  canvas {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    touch-action: none;
    max-width: 100%;
    height: auto;
    cursor: crosshair;
  }
  button {
    border: 0;
    background: #111;
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #333; }
</style>
</head>
<body>
  <h1>Scribble &mdash; WebAssembly + Rust</h1>
  <div class="toolbar">
    <label>Color <input type="color" id="color" value="#111111" /></label>
    <label>Size <input type="range" id="size" min="1" max="40" value="3" /></label>
    <button id="clear" type="button">Clear</button>
  </div>
  <canvas id="scribble" width="900" height="600"></canvas>

  <script type="module">
    import init from "./pkg/scribble_wasm.js";
    init().catch(err => {
      console.error(err);
      document.body.insertAdjacentHTML(
        "beforeend",
        `<pre style="color:#b00">Failed to load wasm: ${err}</pre>`
      );
    });
  </script>
</body>
</html>
